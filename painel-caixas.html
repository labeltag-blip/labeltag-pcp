<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Caixas</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--mut:#6b7280;--bd:#e3e5e8;
  --livre:#e8f6ee;--livre-tx:#177245;--livre-bd:#b9e3c9;
  --uso-p:#2b2d31;--uso-p-tx:#fff;
  --verm:#d62d2d;--verm-soft:#fdecec;--verm-tx:#a31f1f;
  --alerta:#f59e0b;--acc:#2563eb;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111316;--card:#1b1e23;--tx:#e8e9eb;--mut:#9aa0a8;--bd:#2c3036;
  --livre:#12291c;--livre-tx:#6fd39a;--livre-bd:#1f4a31;
  --uso-p:#e8e9eb;--uso-p-tx:#111316;
  --verm:#ef4444;--verm-soft:#3a1616;--verm-tx:#fca5a5;--acc:#60a5fa;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.marca{display:flex;align-items:center;gap:14px;min-width:0;color:var(--tx)}
.logo{height:46px;width:auto;flex:none}
h1{font-size:20px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){
  .marca{flex-direction:column;align-items:flex-start;gap:3px}
  .logo{height:36px}
  h1{font-size:17px}
}
.sync{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 inherit;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{color:#16a34a;background:#e8f6ee;border-color:#b9e3c9}
.sync.ok::before{animation:pulse 2s infinite}
.sync.err{color:var(--verm);background:var(--verm-soft);border-color:var(--verm)}
.sync.demo{color:#b45309;background:#fef3c7;border-color:#fcd34d}
.sync small{font-weight:500;opacity:.75}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sync.tr{color:#0c66e4;background:#e9f2ff;border-color:#b3d4ff}
.sync.tr.velho{color:#b45309;background:#fef3c7;border-color:#fcd34d}
.sync.tr.err{color:var(--verm);background:var(--verm-soft);border-color:var(--verm)}
.sync.tr.rodando::before{animation:pulse 1s infinite}
.cx.tl::before{content:"T";position:absolute;left:4px;top:2px;font-size:9px;font-weight:800;opacity:.7}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:#e9f2ff;color:#0c66e4;margin-left:6px;vertical-align:middle}
.aviso{background:#fef3c7;color:#78350f;border:1px solid #fcd34d;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.aviso b{display:block;margin-bottom:4px}
.aviso li{margin:2px 0}
.nota{font-size:13px;color:var(--mut);background:var(--bg);border-radius:8px;padding:10px;margin-top:4px}
.nota a{color:var(--acc);font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sync.tr{background:#0b2447;border-color:#1d4ed8;color:#93c5fd}:root:not([data-theme="light"]) .chip{background:#0b2447;color:#93c5fd}:root:not([data-theme="light"]) .aviso{background:#3a2a08;color:#fde68a;border-color:#92400e}
:root:not([data-theme="light"]) .sync.ok{background:#12291c;border-color:#1f4a31;color:#4ade80}
:root:not([data-theme="light"]) .sync.demo{background:#3a2a08;border-color:#92400e;color:#fbbf24}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--mut)}
.kpi.v b{color:var(--verm)}
.kpi.al b{color:var(--alerta)}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button,.fil button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tabs button[data-t="V"].on{background:var(--verm);border-color:var(--verm);color:#fff}
.bar{display:flex;gap:6px;margin-top:8px}
.bar input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.fil{display:flex;gap:4px}
.fil button{flex:none;padding:8px 10px;font-weight:500;font-size:13px}
.fil button.on{border-color:var(--acc);color:var(--acc)}
main{padding:12px 16px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.cx{position:relative;border-radius:8px;padding:10px 0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;border:1px solid var(--livre-bd);background:var(--livre);color:var(--livre-tx);user-select:none}
.cx.uso{background:var(--uso-p);color:var(--uso-p-tx);border-color:var(--uso-p)}
.cx.V.uso{background:var(--verm);border-color:var(--verm);color:#fff}
.cx.al::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--alerta);box-shadow:0 0 0 2px var(--card)}
.cx.hi{outline:3px solid var(--acc);outline-offset:1px}
.lista{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer}
.item .tag{min-width:62px;text-align:center;font-weight:700;border-radius:6px;padding:6px 0;background:var(--uso-p);color:var(--uso-p-tx)}
.item .tag.V{background:var(--verm);color:#fff}
.item .inf{flex:1;min-width:0}
.item .inf div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .inf div+div{font-size:12px;color:var(--mut)}
.item .tempo{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.al .tempo{color:var(--alerta)}
.vazio{text-align:center;color:var(--mut);padding:40px 0}
.fab{position:fixed;left:16px;right:16px;bottom:16px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;color:#fff;background:var(--acc);box-shadow:0 4px 16px rgba(0,0,0,.2);cursor:pointer}
.fab.V{background:var(--verm)}
.fab:disabled{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet .st{font-size:13px;color:var(--mut);margin-bottom:12px}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 14px}
.sheet dt{color:var(--mut)}.sheet dd{margin:0;font-weight:600}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.sheet input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--bd);font:inherit;font-weight:700;cursor:pointer;background:var(--card);color:var(--tx)}
.acts .pri{background:var(--acc);border-color:var(--acc);color:#fff}
.acts .lib{background:var(--livre-tx);border-color:var(--livre-tx);color:#fff}
.acts button:disabled{opacity:.5}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;z-index:20;display:none;max-width:90vw}
.toast.err{background:var(--verm);color:#fff}
body.embed .marca{display:none}
body.embed header{padding-top:8px}
body.embed .top{justify-content:flex-end}
body.embed .pills{flex-direction:row}
.demo{background:var(--alerta);color:#000;text-align:center;font-size:12px;padding:4px;font-weight:600}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>MODO DEMO — dados fictícios. Configure a chave do Supabase (SUPA_KEY) no código.</div>
<header>
  <div class="top">
    <div class="marca"><h1>Controle de Caixas</h1></div>
    <div class="pills">
      <button id="sync" class="sync" title="Toque para atualizar">Conectando…</button>
      <button id="trello" class="sync tr" title="Toque para sincronizar com o Trello agora" hidden>Trello</button>
    </div>
  </div>
  <div class="kpis">
    <div class="kpi v"><b id="kVl">–</b><span>Vermelhas livres</span></div>
    <div class="kpi"><b id="kPl">–</b><span>Pretas livres</span></div>
    <div class="kpi"><b id="kU">–</b><span>Em uso</span></div>
    <div class="kpi al"><b id="kA">–</b><span>Paradas demais</span></div>
  </div>
  <div class="tabs">
    <button data-t="V">🔴 Vermelhas</button>
    <button data-t="P" class="on">⚫ Pretas</button>
    <button data-t="U">Em uso</button>
  </div>
  <div class="bar">
    <input id="q" type="search" inputmode="search" placeholder="Nº da caixa ou OP">
    <div class="fil" id="fil">
      <button data-f="T" class="on">Todas</button>
      <button data-f="L">Livres</button>
      <button data-f="O">Ocupadas</button>
    </div>
  </div>
</header>
<main id="main"></main>
<button id="fab" class="fab">Pegar próxima preta livre</button>

<div id="ov" class="ov">
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ===== MODO EMBUTIDO (?embed=1, usado dentro da aba do PCP) ===== */
if (/[?&]embed=1\b/.test(location.search)) document.body.classList.add('embed');

/* ===== CONFIG ===== */
// FONTE: 'supabase' (novo) ou 'apps' (volta para o Apps Script/planilha, se precisar)
const FONTE    = 'supabase';
const SUPA_URL = 'https://qbdzzngcwxljomqiboqh.supabase.co';
const SUPA_KEY = 'sb_publishable_JIFQyxCn9MYZwc_MFJfUNA_F3saGuEp';   // anon key ou publishable key (sb_publishable_...). NUNCA a service_role/secret.
const API_URL  = 'https://script.google.com/macros/s/AKfycbyEiYnOMAXccKCUUOWeHEXqdm8YPF08xFH9otXowOPBqKUgj7A3Nv6MUvFgn439v2TY/exec';
const TOKEN    = 'labeltag-caixas';  // igual ao TOKEN do Code.gs (só modo 'apps')
const ALERTA_H = { V: 24, P: 72 };   // horas até marcar caixa como "parada demais"
const REFRESH_S = 30;
const RECARGA_TOTAL_MIN = 10;        // no Supabase: a cada 10 min recarrega tudo (segurança); no resto só o que mudou

const USA_SUPA = FONTE === 'supabase';
const ATIVO = USA_SUPA ? !!SUPA_KEY && !/^COLE_AQUI/.test(SUPA_KEY) : !!API_URL;

/* ===== ESTADO ===== */
let caixas = [], aba = 'P', filtro = 'T', busca = '', ocupado = false, trello = null;
const TRELLO_VELHO_MIN = 15; // acima disso o selo Trello fica amarelo
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(_) { return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} }
};

/* ===== SUPABASE ===== */
const CAMPOS = 'id,cor,num,em_uso,op,desde,quem,card,atualizado_em';
let marcaTempo = '', ultimaRecargaTotal = 0;
function supaHeaders(extra){
  const h = Object.assign({ apikey: SUPA_KEY, 'Accept-Profile': 'caixas', 'Content-Profile': 'caixas' }, extra || {});
  if (!/^sb_/.test(SUPA_KEY)) h.Authorization = 'Bearer ' + SUPA_KEY; // chave antiga (JWT)
  return h;
}
async function supaReq(caminho, opts){
  const r = await fetch(SUPA_URL + caminho, opts);
  let j = null; try { j = await r.json(); } catch(_) {}
  if (!r.ok) throw new Error((j && (j.message || j.erro)) || ('HTTP ' + r.status));
  return j;
}
const deSupa = r => ({ id:r.id, cor:r.cor, num:r.num, uso:!!r.em_uso, op:r.op||'', desde:r.desde||'', quem:r.quem||'', card:r.card||'' });
function aplicar(linhas){
  const idx = new Map(caixas.map((c,i)=>[c.id,i]));
  for (const r of linhas) {
    const c = deSupa(r);
    if (idx.has(c.id)) caixas[idx.get(c.id)] = c; else { idx.set(c.id, caixas.length); caixas.push(c); }
    if (r.atualizado_em && (!marcaTempo || r.atualizado_em > marcaTempo)) marcaTempo = r.atualizado_em;
  }
}
async function carregarSupa(){
  const total = !caixas.length || !marcaTempo || (Date.now() - ultimaRecargaTotal) > RECARGA_TOTAL_MIN * 6e4;
  const filtroT = total ? '' : '&atualizado_em=gt.' + encodeURIComponent(marcaTempo);
  const [linhas, st] = await Promise.all([
    supaReq('/rest/v1/caixas?select=' + CAMPOS + filtroT, { headers: supaHeaders() }),
    supaReq('/rest/v1/sync_status?select=ultima,erro,avisos&id=eq.1', { headers: supaHeaders() })
  ]);
  if (total) { caixas = []; marcaTempo = ''; ultimaRecargaTotal = Date.now(); }
  aplicar(linhas || []);
  const s = st && st[0];
  trello = s ? { ultima: s.ultima || '', erro: s.erro || '', avisos: s.avisos || {} } : null;
}
async function enviarSupa(acao, id, op, quem){
  const corpo = acao === 'ocupar' ? { p_id:id, p_op:op, p_quem:quem } : { p_id:id, p_quem:quem };
  try {
    const r = await supaReq('/rest/v1/rpc/' + acao, {
      method:'POST', headers: supaHeaders({ 'Content-Type':'application/json' }), body: JSON.stringify(corpo)
    });
    if (r) aplicar([r]);
  } catch (e) { carregarSupa().catch(()=>{}); throw e; }
}

/* ===== API (escolhe a fonte) ===== */
async function carregar(){
  if (!ATIVO) return demo();
  try {
    if (USA_SUPA) await carregarSupa();
    else {
      const r = await fetch(API_URL + '?token=' + encodeURIComponent(TOKEN));
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro);
      caixas = j.caixas; if (j.trello) trello = j.trello;
    }
    marcaSync(); render();
  } catch (e) { marcaSync(e); }
}
async function enviar(acao, id, op){
  const quem = store.get('caixas_quem');
  if (!ATIVO) return demoAlterar(acao, id, op, quem);
  if (USA_SUPA) return enviarSupa(acao, id, op, quem);
  // text/plain evita preflight CORS no Apps Script
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ token:TOKEN, acao, id, op, quem }) });
  const j = await r.json();
  if (j.caixas) caixas = j.caixas;
  if (j.trello) trello = j.trello;
  if (!j.ok) throw new Error(j.erro);
  return j;
}
function marcaSync(err){
  const el = $('#sync');
  const hora = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if (err) {
    el.className = 'sync err';
    el.innerHTML = 'Desconectado';
    el.title = (err.message||err) + ' — toque para tentar de novo';
    return;
  }
  el.className = 'sync ' + (ATIVO ? 'ok' : 'demo');
  el.innerHTML = (ATIVO ? 'Conectado' : 'Demo') + ' <small>' + hora + '</small>';
  el.title = 'Atualizado às ' + hora + (USA_SUPA ? ' (Supabase)' : ' (planilha)') + ' — toque para atualizar';
  marcaTrello();
}
function marcaTrello(rodando){
  const el = $('#trello');
  if (!ATIVO || !trello) { el.hidden = true; return; }
  el.hidden = false;
  if (rodando) { el.className = 'sync tr rodando'; el.textContent = 'Sincronizando…'; return; }
  const ult = trello.ultima ? new Date(trello.ultima) : null;
  const errData = trello.erro ? new Date(trello.erro.slice(0, 24)) : null;
  const comErro = trello.erro && (!ult || (errData && errData > ult));
  const min = ult ? (Date.now() - ult) / 6e4 : Infinity;
  const hora = ult ? ult.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—';
  el.className = 'sync tr' + (comErro ? ' err' : (min > TRELLO_VELHO_MIN ? ' velho' : ''));
  el.innerHTML = 'Trello <small>' + (comErro ? 'erro' : hora) + '</small>';
  el.title = comErro ? trello.erro + ' — toque para tentar de novo'
    : (ult ? 'Última sincronização às ' + hora : 'Ainda não sincronizou') + ' — toque para sincronizar agora';
}
async function sincronizarAgora(){
  if (!ATIVO || ocupado) return;
  ocupado = true; marcaTrello(true);
  try {
    let j;
    if (USA_SUPA) {
      j = await supaReq('/functions/v1/sync-trello', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:'{}' });
      await carregarSupa();
    } else {
      const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ token:TOKEN, acao:'sync' }) });
      j = await r.json();
      if (j.caixas) caixas = j.caixas;
      if (j.trello) trello = j.trello;
    }
    if (!j.ok) throw new Error(j.erro);
    if (j.pulado) toast('Trello: sincronizado há poucos segundos');
    else { const s = j.resumo || {}; toast(`Trello: ${s.caixasTrello ?? 0} caixas em cards, ${s.alteracoes ?? 0} alterações`); }
  } catch (e) { toast('Trello: ' + e.message, true); }
  finally { ocupado = false; marcaSync(); render(); }
}

/* ===== REGRAS ===== */
const horas = c => c.uso && c.desde ? (Date.now() - new Date(c.desde)) / 36e5 : 0;
const emAlerta = c => c.uso && horas(c) >= ALERTA_H[c.cor];
function fmtTempo(h){
  if (h < 1) return Math.max(1, Math.round(h*60)) + ' min';
  if (h < 48) return Math.floor(h) + ' h';
  return Math.floor(h/24) + ' d';
}
const rotulo = c => (c.cor === 'V' ? 'V-' : 'P-') + c.num;
const proximaLivre = cor => caixas.filter(c => c.cor === cor && !c.uso).sort((a,b)=>a.num-b.num)[0];

/* ===== RENDER ===== */
function render(){
  const V = caixas.filter(c=>c.cor==='V'), P = caixas.filter(c=>c.cor==='P');
  $('#kVl').textContent = V.filter(c=>!c.uso).length;
  $('#kPl').textContent = P.filter(c=>!c.uso).length;
  $('#kU').textContent  = caixas.filter(c=>c.uso).length;
  $('#kA').textContent  = caixas.filter(emAlerta).length;

  const q = busca.trim().toLowerCase();
  const casa = c => !q || String(c.num) === q || String(c.num).startsWith(q) || (c.op && c.op.toLowerCase().includes(q));

  $('#fil').style.display = aba === 'U' ? 'none' : '';
  const fab = $('#fab');
  if (aba === 'U') { fab.style.display = 'none'; }
  else {
    fab.style.display = '';
    const nx = proximaLivre(aba);
    fab.className = 'fab ' + aba;
    fab.disabled = !nx;
    fab.textContent = nx ? `Pegar próxima ${aba==='V'?'vermelha':'preta'} livre (${nx.num})` : 'Nenhuma livre';
  }

  const main = $('#main');
  if (aba === 'U') {
    const l = caixas.filter(c=>c.uso && casa(c)).sort((a,b)=> (emAlerta(b)-emAlerta(a)) || (b.cor==='V')-(a.cor==='V') || horas(b)-horas(a));
    main.innerHTML = avisosHtml() + (l.length ? '<div class="lista">' + l.map(c=>`
      <div class="item ${emAlerta(c)?'al':''}" data-id="${c.id}">
        <div class="tag ${c.cor}">${rotulo(c)}</div>
        <div class="inf"><div>${esc(c.op)||'<i>sem OP</i>'}</div><div>${c.card?'<span class="chip" style="margin-left:0">TRELLO</span>':esc(c.quem)}</div></div>
        <div class="tempo">${emAlerta(c)?'⚠ ':''}${fmtTempo(horas(c))}</div>
      </div>`).join('') + '</div>'
      : '<div class="vazio">Nenhuma caixa em uso</div>');
    return;
  }
  let l = (aba==='V'?V:P).slice().sort((a,b)=>a.num-b.num);
  if (filtro === 'L') l = l.filter(c=>!c.uso);
  if (filtro === 'O') l = l.filter(c=>c.uso);
  if (q) l = l.filter(casa);
  main.innerHTML = l.length ? '<div class="grid">' + l.map(c=>
    `<div class="cx ${c.cor} ${c.uso?'uso':''} ${emAlerta(c)?'al':''} ${c.card?'tl':''}" data-id="${c.id}">${c.num}</div>`
  ).join('') + '</div>' : '<div class="vazio">Nada encontrado</div>';
}
function avisosHtml(){
  const a = trello && trello.avisos; if (!a) return '';
  const c = a.conflitos || [], inv = a.invalidas || [];
  if (!c.length && !inv.length) return '';
  let h = '<div class="aviso"><b>⚠ Revisar no Trello</b><ul style="margin:0;padding-left:18px">';
  c.slice(0,10).forEach(x => h += '<li>Mesma caixa em 2 cards — ' + esc(x) + '</li>');
  inv.slice(0,10).forEach(x => h += '<li>Número de caixa inexistente — ' + esc(x) + '</li>');
  return h + '</ul></div>';
}
const esc = s => String(s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ===== FOLHA DE AÇÃO ===== */
function abrir(id){
  const c = caixas.find(x=>x.id===id); if (!c) return;
  const quem = store.get('caixas_quem');
  const cor = c.cor==='V' ? '🔴 Vermelha' : '⚫ Preta';
  let h = `<h2>${cor} ${c.num}</h2>`;
  if (c.uso) {
    h += `<div class="st">Em uso há ${fmtTempo(horas(c))}${emAlerta(c)?' — ⚠ acima do limite':''}</div>
      <dl><dt>OP</dt><dd>${esc(c.op)||'—'}</dd><dt>Por</dt><dd>${esc(c.quem)}</dd>
      <dt>Desde</dt><dd>${c.desde?new Date(c.desde).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}</dd></dl>`;
    if (c.card) {
      h += `<div class="nota">Vinculada ao Trello. É liberada automaticamente quando o card for arquivado.<br>
        <a href="https://trello.com/c/${encodeURIComponent(c.card)}" target="_blank" rel="noopener">Abrir card no Trello ↗</a></div>
        <div class="acts"><button id="bX">Fechar</button></div>`;
      $('#sheet').innerHTML = h; $('#ov').classList.add('on'); $('#bX').onclick = fechar; return;
    }
  } else {
    h += `<div class="st">Livre</div>
      <label for="fOp">OP / Pedido</label><input id="fOp" inputmode="text" autocomplete="off">`;
  }
  h += `<label for="fQuem">Seu nome</label><input id="fQuem" value="${esc(quem)}" autocomplete="name">
    <div class="acts"><button id="bX">Cancelar</button>
    <button id="bOk" class="${c.uso?'lib':'pri'}">${c.uso?'Liberar caixa':'Ocupar caixa'}</button></div>`;
  $('#sheet').innerHTML = h;
  $('#ov').classList.add('on');
  const foco = c.uso ? (quem ? null : '#fQuem') : '#fOp';
  if (foco) setTimeout(()=>$(foco).focus(), 50);
  $('#bX').onclick = fechar;
  $('#bOk').onclick = async () => {
    const nome = $('#fQuem').value.trim();
    if (!nome) { toast('Informe seu nome', true); $('#fQuem').focus(); return; }
    store.set('caixas_quem', nome);
    const op = c.uso ? '' : $('#fOp').value.trim();
    if (!c.uso && !op && !confirm('Ocupar sem OP?')) return;
    $('#bOk').disabled = true; ocupado = true;
    const acao = c.uso ? 'liberar' : 'ocupar', nomeCx = rotulo(c);
    try {
      await enviar(acao, c.id, op);
      toast(`${nomeCx} ${acao === 'liberar' ? 'liberada' : 'ocupada'}`);
      fechar();
    } catch (e) { toast(e.message, true); $('#bOk').disabled = false; }
    finally { ocupado = false; render(); }
  };
}
function fechar(){ $('#ov').classList.remove('on'); }
let tt; function toast(m, err){ const t=$('#toast'); t.textContent=m; t.className='toast'+(err?' err':''); t.style.display='block'; clearTimeout(tt); tt=setTimeout(()=>t.style.display='none', 3000); }

/* ===== EVENTOS ===== */
document.querySelector('.tabs').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  aba=b.dataset.t; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); render(); };
$('#fil').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  filtro=b.dataset.f; document.querySelectorAll('#fil button').forEach(x=>x.classList.toggle('on',x===b)); render(); };
$('#sync').onclick = () => { const el=$('#sync'); el.className='sync'; el.textContent='Atualizando…'; carregar(); };
$('#trello').onclick = sincronizarAgora;
$('#q').oninput =e => { busca = e.target.value; render(); };
$('#main').onclick = e => { const el=e.target.closest('[data-id]'); if(el) abrir(el.dataset.id); };
$('#fab').onclick = () => { const nx = proximaLivre(aba); if (nx) abrir(nx.id); };
$('#ov').onclick = e => { if (e.target.id==='ov') fechar(); };
document.addEventListener('keydown', e => { if (e.key==='Escape') fechar(); });
setInterval(()=>{ if(!ocupado && !$('#ov').classList.contains('on') && !document.hidden) carregar(); }, REFRESH_S*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) carregar(); });

function demoAlterar(acao,id,op,quem){
  const c = caixas.find(x=>x.id===id);
  if (acao==='ocupar'){ if(c.uso) throw new Error(id+' já ocupada'); Object.assign(c,{uso:true,op,quem,desde:new Date().toISOString()}); }
  else { if(!c.uso) throw new Error(id+' já livre'); Object.assign(c,{uso:false,op:'',quem:'',desde:''}); }
}
